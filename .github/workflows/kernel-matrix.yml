name: Kernel matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  system:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kernel: ['5.10.265', '6.1.183', '6.12.100']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Install virtme-ng
        run: sudo apt-get update && sudo apt-get install -y virtme-ng qemu-system-x86 busybox-static zstd
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run system tests on Linux ${{ matrix.kernel }}
        run: >-
          vng -v -r v${{ matrix.kernel }} --user root --
          env "PATH=$PATH" PSI_REQUIRE_TRIGGERS=1 bundle exec rake test:system
