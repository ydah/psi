name: Ruby

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    name: Ruby ${{ matrix.ruby }}
    strategy:
      matrix:
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run unit tests
        run: bundle exec rake test:unit
      - name: Run with GC stress
        run: bundle exec rake test:gc_stress
      - name: Validate RBS
        run: bundle exec rbs validate
      - name: Build documentation
        run: bundle exec yard

  system:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run isolated Linux system tests
        run: |
          bundle_volume="psi-bundle-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$bundle_volume"
          trap 'docker volume rm "$bundle_volume"' EXIT
          docker run --rm -v "$bundle_volume:/usr/local/bundle" -v "$PWD:/app" -w /app ruby:3.4 bundle install
          docker run --rm --privileged --cgroupns=host --memory=512m -v "$bundle_volume:/usr/local/bundle" -v "$PWD:/app" -w /app ruby:3.4 sh -lc \
            'PSI_REQUIRE_TRIGGERS=1 PSI_REQUIRE_CGROUP=1 bundle exec rake test:system'
